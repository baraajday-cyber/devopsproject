name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest test_app.py -v --junitxml=pytest-results.xml

      - name: Analyse sécurité (bandit)
        run: bandit -ll app.py -f json -o bandit-report.json

      - name: Résultats des tests et Bandit (artefacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            bandit-report.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t task-api:latest .

      - name: Smoke test du conteneur
        run: |
          docker run -d --name task-api -p 5000:5000 task-api:latest
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/health; then exit 0; fi
            sleep 2
          done
          echo "Le conteneur ne répond pas, logs du conteneur :"
          docker logs task-api
          exit 1

      - name: Scan sécurité de l'image (Trivy)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed task-api:latest | tee trivy-report.txt

      - name: Rapport Trivy (artefact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt

  publish:
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/task-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/task-api:${{ github.sha }}

  dast:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image (pour le cluster local)
        run: docker build -t braybar/task-api:ci .

      # Cluster kind + déploiement de l'app (issue #8)
      - name: Créer le cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: taskapi

      - name: Charger l'image dans kind
        run: kind load docker-image braybar/task-api:ci --name taskapi

      - name: Déployer les manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl set image deployment/task-api task-api=braybar/task-api:ci
          kubectl rollout status deployment/task-api --timeout=180s || true
          kubectl describe deployment/task-api
          kubectl get pods -o wide
          kubectl describe pods -l app=task-api | head -50
          kubectl logs -l app=task-api --all-containers --tail=30 || true

      - name: Exposer l'app localement
        run: |
          nohup kubectl port-forward svc/task-api 8080:80 >/dev/null 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/health

      # DAST ZAP baseline sur l'app déployée (issue #8)
      - name: Scan DAST ZAP baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8080
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-I -w /zap/wrk/zap_report.html"

      - name: Rapport ZAP (artefact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap_report.html
