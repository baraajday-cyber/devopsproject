name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest test_app.py -v --junitxml=pytest-results.xml

      - name: Analyse sécurité (bandit)
        run: bandit -ll app.py -f json -o bandit-report.json

      - name: Résultats des tests et Bandit (artefacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            bandit-report.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t task-api:latest .

      - name: Smoke test du conteneur
        run: |
          docker run -d --name task-api -p 5000:5000 task-api:latest
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/health; then exit 0; fi
            sleep 2
          done
          echo "Le conteneur ne répond pas, logs du conteneur :"
          docker logs task-api
          exit 1

      - name: Scan sécurité de l'image (Trivy)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed task-api:latest | tee trivy-report.txt

      - name: Rapport Trivy (artefact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt
