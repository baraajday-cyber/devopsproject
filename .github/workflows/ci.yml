name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest test_app.py -v

      - name: Analyse sécurité (bandit)
        run: bandit app.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t task-api:latest .

      - name: Smoke test du conteneur
        run: |
          docker run -d --name task-api -p 5000:5000 task-api:latest
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/health; then exit 0; fi
            sleep 2
          done
          echo "Le conteneur ne répond pas" && exit 1
